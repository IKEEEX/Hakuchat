<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hakuchat</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #fff; --text: #1d2125; --muted: #6b7280;
    --user: #dbeafe; --bot: #fff; --border: #d9dde3; --accent: #2563eb;
    --search: #fef9c3; --error: #fee2e2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171a; --panel: #1f2226; --text: #e6e8eb; --muted: #9aa1ab;
      --user: #1e3a5f; --bot: #262a2f; --border: #353a41; --accent: #60a5fa;
      --search: #3d3714; --error: #4c1d1d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 15px/1.5 system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    padding: 10px 16px; border-bottom: 1px solid var(--border);
    background: var(--panel); display: flex; align-items: center; gap: 12px;
  }
  header h1 { font-size: 17px; margin: 0; flex: 1; }
  #messages {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .msg {
    max-width: 760px; padding: 8px 12px; border-radius: 10px;
    white-space: pre-wrap; overflow-wrap: anywhere;
    border: 1px solid var(--border);
  }
  .user { align-self: flex-end; background: var(--user); }
  .bot { align-self: flex-start; background: var(--bot); }
  .search, .info {
    align-self: flex-start; font-size: 13px; color: var(--muted);
    padding: 2px 10px; border-radius: 6px;
  }
  .search { background: var(--search); color: var(--text); }
  .error { align-self: flex-start; background: var(--error); }
  a { color: var(--accent); }
  form {
    display: flex; gap: 8px; padding: 12px 16px;
    border-top: 1px solid var(--border); background: var(--panel);
  }
  #input {
    flex: 1; padding: 9px 12px; font: inherit; color: inherit;
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  }
  button {
    padding: 9px 16px; font: inherit; border: 0; border-radius: 8px;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  #reset { background: transparent; color: var(--muted); border: 1px solid var(--border); padding: 5px 10px; }
</style>
</head>
<body>
<header>
  <h1>Hakuchat</h1>
  <button id="reset" type="button">Uusi keskustelu</button>
</header>
<div id="messages"></div>
<form id="form">
  <input id="input" type="text" placeholder="Kirjoita viesti…" autocomplete="off" autofocus>
  <button id="send" type="submit">Lähetä</button>
</form>

<script>
const messagesEl = document.getElementById("messages");
const form = document.getElementById("form");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");

const SOURCE_NAMES = {
  "duckduckgo": "DuckDuckGo",
  "wikipedia-fi": "Wikipedia (fi)",
  "wikipedia-en": "Wikipedia (en)",
};

function getSessionId() {
  let id = null;
  try { id = sessionStorage.getItem("session_id"); } catch (e) {}
  if (!id) {
    id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random());
    try { sessionStorage.setItem("session_id", id); } catch (e) {}
  }
  return id;
}
let sessionId = getSessionId();

// Builds DOM nodes from text: Markdown links [title](url) and bare http(s) URLs
// become <a> elements; everything else is plain text (no innerHTML -> no XSS).
const LINK_RE = /\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)|(https?:\/\/[^\s<>"')\]]+)/g;
function renderText(el, text) {
  let last = 0;
  for (const m of text.matchAll(LINK_RE)) {
    el.append(text.slice(last, m.index));
    let label = m[1], url = m[2];
    let trailing = "";
    if (!url) {
      url = m[3];
      const t = url.match(/[.,;:!?]+$/);  // don't swallow sentence punctuation
      if (t) { trailing = t[0]; url = url.slice(0, -trailing.length); }
      label = url;
    }
    const a = document.createElement("a");
    a.href = url; a.textContent = label;
    a.target = "_blank"; a.rel = "noopener noreferrer";
    el.append(a, trailing);
    last = m.index + m[0].length;
  }
  el.append(text.slice(last));
}

function addMessage(cls, text) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  renderText(div, text);
  messagesEl.append(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function addLine(cls, text) {
  const div = document.createElement("div");
  div.className = cls;
  div.textContent = text;
  messagesEl.append(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function describeSearch(s) {
  if (s.error) return "🔍 Virheellinen hakukutsu";
  const source = SOURCE_NAMES[s.source] || "ei lähdettä";
  return `🔍 Haku: "${s.query}" – ${source}, ${s.count} tulosta`;
}

async function send() {
  const text = input.value.trim();
  if (!text || sendBtn.disabled) return;
  input.value = "";
  addMessage("user", text);
  sendBtn.disabled = true;
  const waiting = addLine("info", "Odotetaan vastausta…");

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, message: text }),
    });
    const data = await res.json().catch(() => ({}));
    waiting.remove();
    if (!res.ok) {
      addMessage("error", "Virhe: " + (data.error || res.status));
      return;
    }
    if (data.searches && data.searches.length) {
      data.searches.forEach(s => addLine("search", describeSearch(s)));
    } else {
      addLine("info", "Ei hakua");
    }
    addMessage("bot", data.reply || "(tyhjä vastaus)");
  } catch (e) {
    waiting.remove();
    addMessage("error", "Virhe: palvelimeen ei saatu yhteyttä");
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

// A submit event fires both from the button and from Enter in the text field.
form.addEventListener("submit", e => { e.preventDefault(); send(); });

document.getElementById("reset").addEventListener("click", async () => {
  await fetch("/api/reset", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ session_id: sessionId }),
  }).catch(() => {});
  sessionId = crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random();
  try { sessionStorage.setItem("session_id", sessionId); } catch (e) {}
  messagesEl.replaceChildren();
  input.focus();
});
</script>
</body>
</html>
